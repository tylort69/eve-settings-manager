[package]
name = "eve-settings-manager"
version = "2.1.0"
edition = "2024"
description = "EVE Online local settings manager for Linux and Windows (native Rust, Material You)"
license = "MIT"
rust-version = "1.97"
authors = ["tylort69", "Nick Ning (original EVE Settings Manager)"]
repository = "https://github.com/tylort69/eve-settings-manager"
readme = "README.md"
keywords = ["eve-online", "settings", "material-you", "matugen", "egui"]
categories = ["games", "gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.37"
egui_material_icons = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
rfd = "0.15"
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
material-colors = "0.5"
open = "5"

[target.'cfg(not(windows))'.dependencies]
glob = "0.3"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
